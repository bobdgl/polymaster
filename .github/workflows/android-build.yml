name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential git
        sudo apt-get install -y nlohmann-json3-dev glm-dev
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Build Console Test - Debug
      run: |
        echo "=== System Info ==="
        cmake --version
        g++ --version
        echo "=== Directory Structure ==="
        find . -name "*.h" -o -name "*.cpp" | head -20
        echo "=== Starting Build ==="
        mkdir -p build
        cd build
        cmake .. || (echo "CMAKE FAILED" && cat CMakeError.log)
        make -j4 VERBOSE=1 || (echo "MAKE FAILED" && cat CMakeFiles/*.log)
        echo "=== Build Output ==="
        ls -laR bin/ || echo "No bin directory"
    
    - name: Run Test
      if: always()
      run: |
        if [ -f build/bin/polymaster_test ]; then
          ./build/bin/polymaster_test
        else
          echo "polymaster_test not found"
          find build -name "polymaster_test" -o -name "*.o"
        fi
    
    - name: Upload Console Test
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: polymaster_test
        path: build/bin/polymaster_test
        retention-days: 30
