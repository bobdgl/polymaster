name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Build Console Test
      run: |
        mkdir -p build
        cd build
        cmake ..
        make -j4
    
    - name: Upload Console Test
      uses: actions/upload-artifact@v3
      with:
        name: polymaster_test
        path: build/bin/polymaster_test
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Build Android (Simplified)
      run: |
        echo "Android build placeholder"
