name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential wget unzip
        
        # Создаём директории ДО копирования!
        sudo mkdir -p /usr/include/nlohmann
        sudo mkdir -p /usr/include/glm
        
        # Скачиваем GLM
        cd /tmp
        wget -q https://github.com/g-truc/glm/releases/download/0.9.9.8/glm-0.9.9.8.zip
        unzip -q glm-0.9.9.8.zip
        sudo cp -r glm/glm/* /usr/include/glm/
        
        # Скачиваем nlohmann/json
        cd /tmp
        wget -q https://github.com/nlohmann/json/releases/download/v3.11.2/json.hpp
        sudo cp json.hpp /usr/include/nlohmann/
        
        echo "✅ Dependencies ready"
        ls /usr/include/glm/ | head -5
        ls /usr/include/nlohmann/
    
    - name: Build Test
      run: |
        mkdir -p build
        cd build
        cmake ..
        make -j4
    
    - name: Run Test
      if: always()
      run: |
        if [ -f build/bin/polymaster_test ]; then
          ./build/bin/polymaster_test
        fi
    
    - name: Upload Test Binary
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: polymaster_test
        path: build/bin/polymaster_test
        retention-days: 30
