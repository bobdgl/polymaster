name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Install CMake
      run: sudo apt-get install -y cmake
    
    - name: Build Console Test
      run: |
        mkdir -p build
        cd build
        cmake ..
        make -j4
        ./bin/polymaster_test
    
    - name: Upload Console Test
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: polymaster_test
        path: build/bin/polymaster_test
        retention-days: 30
