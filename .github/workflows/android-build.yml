name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config
        sudo apt-get install -y nlohmann-json3-dev glm-dev
        
        # Проверяем установку
        cmake --version
        pkg-config --list-all | grep -i "glm\|json" || echo "No glm/json found"
    
    - name: Build Test
      run: |
        mkdir -p build
        cd build
        cmake .. 2>&1
        make 2>&1 | head -100
    
    - name: Check Build Result
      if: always()
      run: |
        echo "=== Checking build output ==="
        ls -la build/bin/ 2>/dev/null || echo "No bin directory"
        find build -name "polymaster_test" 2>/dev/null || echo "Test binary not found"
        echo "=== Full build directory ==="
        find build -type f \( -name "*.a" -o -name "polymaster_test" \) 2>/dev/null
