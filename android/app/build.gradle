plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    ndkVersion "27.0.12077973"
    
    defaultConfig {
        applicationId "com.polymaster.editor"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    
    externalNativeBuild {
        cmake {
            version "3.22.1"
            path 'CMakeLists.txt'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
